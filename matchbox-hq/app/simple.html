<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matchbox HQ · simple</title>

<style>
:root{
  --ground:#F6F1E9; --panel:#FFFDF9; --panel2:#EDE6D9; --ink:#1A1714; --dim:#6E6458;
  --rule:#DDD3C3; --pink:#D4145A; --pinkbg:#FDEDF2; --ember:#A8620A; --green:#16744A;
  --strike:#5A4652; --shadow:0 1px 0 rgba(26,23,20,.06);
  --f-disp:"Archivo Black","Arial Black",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131114; --panel:#1C191E; --panel2:#252129; --ink:#F4EFE8; --dim:#9A9089;
  --rule:#332E37; --pink:#FF3D7F; --pinkbg:#2A1220; --ember:#F5A524; --green:#35C46F;
  --strike:#6B5364; --shadow:none;
}}
:root[data-theme="dark"]{
  --ground:#131114; --panel:#1C191E; --panel2:#252129; --ink:#F4EFE8; --dim:#9A9089;
  --rule:#332E37; --pink:#FF3D7F; --pinkbg:#2A1220; --ember:#F5A524; --green:#35C46F;
  --strike:#6B5364; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}
.strike{height:14px;background:
  repeating-linear-gradient(58deg,var(--strike) 0 2px,transparent 2px 5px),
  linear-gradient(var(--panel2),var(--panel2));
  opacity:.85}
header{padding-block:26px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-disp);font-size:clamp(30px,7vw,46px);margin:0;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}
h1 em{font-style:normal;color:var(--pink)}
.drop{font-family:var(--f-num);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.stamp{font-family:var(--f-num);font-size:12px;color:var(--dim);text-align:right;letter-spacing:.04em}
h2{font-family:var(--f-disp);font-size:15px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
section{margin-top:40px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:20px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.two,.four{grid-template-columns:1fr}}

/* board */
.col{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:12px}
.colh{font-family:var(--f-num);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:11px}
.colh b{color:var(--ink);font-family:var(--f-num)}
.task{padding:11px 0;border-bottom:1px dashed var(--rule)}
.task:last-child{border-bottom:0;padding-bottom:2px}
.task .t{font-weight:600;line-height:1.3}
.task .n{color:var(--dim);font-size:14px;margin-top:4px}
.tag{font-family:var(--f-num);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;margin-top:7px}
.pip{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.none{color:var(--dim);font-size:14px;padding:6px 0}

/* agents */
.ag{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--rule)}
.ag:first-child{padding-top:0}.ag:last-child{border-bottom:0;padding-bottom:0}
.ag .pip{margin-top:7px}
.ag .nm{font-weight:700}
.ag .dg{color:var(--dim);font-size:15px;line-height:1.4}
.ag .mt{font-family:var(--f-num);font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.live{color:var(--green)}

/* feed */
.feed{max-height:360px;overflow:auto}
.ev{padding:11px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.45}
.ev:first-child{padding-top:0}.ev:last-child{border-bottom:0}
.ev .mt{font-family:var(--f-num);font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

/* decisions */
.dec{background:var(--pinkbg);border:1.5px solid var(--pink);border-radius:5px;padding:20px;margin-bottom:14px}
.dec h3{font-family:var(--f-body);font-weight:700;font-size:21px;margin:0 0 4px;line-height:1.25;text-wrap:balance}
.dec .why{color:var(--dim);font-size:15px;margin-bottom:14px}
.opt{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px 13px;margin-bottom:8px}
.opt b{display:block;font-size:15px}
.opt span{color:var(--dim);font-size:14.5px}
.rec{border-left:3px solid var(--green);padding:2px 0 2px 13px;margin:14px 0;font-size:15px}
.rec b{font-family:var(--f-num);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--green);display:block;margin-bottom:2px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;display:inline-block;margin-bottom:9px}
.chip.now{background:var(--pink);color:#fff}
.chip.later{background:var(--panel2);color:var(--dim)}
details.later{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:14px 18px;margin-top:6px}
details.later summary{cursor:pointer;font-weight:700;font-size:15px}
details.later summary::marker{color:var(--pink)}
details.later .dec{margin-top:14px}
.done-dec{border-color:var(--green);background:transparent}
.done-dec h3{font-size:17px}

/* money */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:700px){.mgrid{grid-template-columns:1fr 1fr}}
.stat .l{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:clamp(20px,4.4vw,27px);font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:14px;display:flex;background:var(--panel2);border-radius:2px;overflow:hidden;margin:20px 0 4px}
.bar i{height:100%}
.key{font-family:var(--f-num);font-size:11px;letter-spacing:.06em;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:2px}
.brow{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.brow:last-child{border-bottom:0;padding-bottom:0}
.brow .n{color:var(--dim);font-size:13.5px;margin-top:2px}
.brow .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:600}
.brow .amt small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;letter-spacing:.05em}

/* form */
textarea{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:13px;font:inherit;min-height:104px;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{font-family:var(--f-body);font-weight:700;font-size:15px;border:0;border-radius:4px;padding:12px 20px;cursor:pointer;background:var(--pink);color:#fff}
button.pick{background:var(--panel);color:var(--ink);border:1px solid var(--ink);font-size:14px;padding:10px 16px}
button.pick:hover{background:var(--ink);color:var(--ground)}
button[disabled]{opacity:.5;cursor:default}
.note{font-size:14px;color:var(--dim);margin-top:10px;min-height:20px}
.note.ok{color:var(--green)}
.sent{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}

/* files */
.file{padding:12px 0;border-bottom:1px solid var(--rule)}
.file:first-child{padding-top:0}.file:last-child{border-bottom:0;padding-bottom:0}
.file .p{font-family:var(--f-num);font-size:12px;color:var(--dim);word-break:break-all;margin-top:3px}
footer{margin-top:48px;border-top:2px solid var(--ink);padding-top:14px;font-family:var(--f-num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  </section>

  <section>
    <h2>Everything the team has made</h2>
    <div class="panel" id="files"></div>
  </section>

  <footer>
    <span>Matchbox HQ</span><span id="fstamp"></span><span>Budget ceiling ₹20,000</span><span>Pune only</span>
  </footer>
</div>

s","text":"Opened your vendor spreadsheet to see exactly what is already in it before I add anything."},{"time":"2026-09-12T18:15:30.860Z","agent":"prodops","text":"Got your vendor sheet - 8 Sivakasi vendors, a call script and a Pune printers tab."},{"time":"2026-09-12T18:15:30.818Z","agent":"master","text":"Team changed: Launch is now Sales and PR, and a new Production and Ops desk joined."},{"time":"2026-09-12T17:39:17.782Z","agent":"website","text":"Website and guide are done - drag the website folder to netlify.com/drop and it is live in 4 minutes for zero rupees"},{"time":"2026-09-12T17:38:33.598Z","agent":"website","text":"Wrote the step-by-step guide for putting the site online free and switching on payments later"},{"time":"2026-09-12T17:35:02.351Z","agent":"master","text":"Launch and Sales finished. Couriers refuse matchboxes - Pune hand-delivery is the only way for now."},{"time":"2026-09-12T17:34:52.951Z","agent":"website","text":"Checked colours for readability and made the page tiny (17 KB) so it loads instantly on phone data"},{"time":"2026-09-12T17:34:52.541Z","agent":"master","text":"Finance finished. 99 rupees is the price that works. 49 rupees loses money on delivery."},{"time":"2026-09-12T17:34:12.751Z","agent":"finance","text":"Correction to my earlier note: break-even is 150 boxes, not 140 - Legal confirmed a small registration cost I had not counted."},{"time":"2026-09-12T17:34:09.837Z","agent":"launch","text":"Checked my numbers against the finance agent's - a rider drop in Pune costs about 50 rupees, so hand-delivery and the 3-box set matter more than I first wrote. Both documents updated."},{"time":"2026-09-12T17:34:03.332Z","agent":"finance","text":"Three files are ready: what you keep per box, the break-even number, and a money tracker you can keep updating."},{"time":"2026-09-12T17:34:03.295Z","agent":"finance","text":"Raised a decision: the budget had no line at all for mailers and delivery, and that is the biggest cost per box. I have parked 3,000 there for now."},{"time":"2026-09-12T17:33:47.673Z","agent":"master","text":"Legal finished. Real cost to start selling legally: about 500 rupees, not 3000."},{"time":"2026-09-12T17:33:25.415Z","agent":"launch","text":"Raised two things for you to decide - how we ship outside Pune, and building a 249 three-box set before any ads run."},{"time":"2026-09-12T17:33:25.375Z","agent":"launch","text":"The rule to remember: do not pay the 8,000 for boxes until 60 are pre-paid, and do not touch the 3,000 ad money until 150 boxes are sold."},{"time":"2026-09-12T17:33:25.343Z","agent":"launch","text":"All four documents are ready: the 500-box plan, the cafe pitch, the marketplace roadmap and the ads plan."},{"time":"2026-09-12T17:33:15.980Z","agent":"legal","text":"Legal work is finished. Total realistic cost to start selling legally in Pune: 500 rupees."},{"time":"2026-09-12T17:33:08.862Z","agent":"legal","text":"Checked the 10 brand names for obvious trademark trouble - drop Burn Book (Mean Girls / Paramount) and Phuljhadi (existing brand plus it means a firework)."},{"time":"2026-09-12T17:32:47.583Z","agent":"master","text":"Brand and Content finished - 10 names checked, 4 were already taken, 3 survive."},{"time":"2026-09-12T17:32:22.752Z","agent":"legal","text":"All three legal files are ready. The one thing to do this week: free Udyam registration at udyamregistration.gov.in - it takes 15 minutes and halves your future trademark fee."},{"time":"2026-09-12T17:32:19.230Z","agent":"brand","text":"Brand work done: 10 names with availability checked, 6 box designs, 30 days of Instagram, and a Pune seeding plan. I need you to pick the name before anything goes to print."},{"time":"2026-09-12T17:32:19.161Z","agent":"brand","text":"Synced my box back-panel with what Legal found - the words Safety Matches also have to go on the FRONT of every box."},{"time":"2026-09-12T17:32:16.057Z","agent":"legal","text":"Raised a decision you must answer before printing: whose postal address goes on the back of every box, because the law requires a real one."},{"time":"2026-09-12T17:32:06.357Z","agent":"finance","text":"The number that matters: you need to sell about 140 boxes to get your launch money back. If all 500 sell, the whole twenty thousand comes back and then some."},{"time":"2026-09-12T17:32:03.514Z","agent":"legal","text":"Cut the legal budget from 3,000 to 1,000 - almost everything you need in week 1 is free, which frees about 2,000 rupees for boxes."},{"time":"2026-09-12T17:31:56.455Z","agent":"brand","text":"Seeding plan done - 60 boxes out of the first 500, scripts for cafes and chai corners, and a tracking sheet."},{"time":"2026-09-12T17:31:33.795Z","agent":"finance","text":"Answer on price: sell at 99 rupees. At 49 rupees a delivered box loses you 21 rupees, because the rider alone costs 50."},{"time":"2026-09-12T17:30:42.537Z","agent":"finance","text":"Verified the real numbers: matches are taxed at 5 percent, Amazon charges no commission under 1,000 rupees, and a Pune rider drop costs about 45 rupees. Now doing the maths."},{"time":"2026-09-12T17:30:32.090Z","agent":"legal","text":"Label rules done - there is a ready-to-use box template your designer can work from, and the legal text must be at least 1mm tall."},{"time":"2026-09-12T17:30:24.007Z","agent":"brand","text":"Thirty days of Instagram is written - captions ready to paste, and a hard no-tobacco rule at the top so we do not get into trouble."},{"time":"2026-09-12T17:30:20.810Z","agent":"website","text":"The website works: form validates, saves a backup copy, and shows a thank-you and share prompt"},{"time":"2026-09-12T17:30:18.725Z","agent":"launch","text":"Cafe pitch written. Push the 60-rupee wholesale deal, 20 boxes, 1200 rupees cash."},{"time":"2026-09-12T17:29:13.250Z","agent":"legal","text":"Legal checklist is done - the whole week-1 list is free, and the only real licence is a 500 rupee Legal Metrology packer registration."},{"time":"2026-09-12T17:29:01.246Z","agent":"master","text":"Supplier Scout is done. Big finding: 500 custom boxes is below what Sivakasi factories will make."},{"time":"2026-09-12T17:28:46.100Z","agent":"launch","text":"Drop 01 plan done. Now writing exactly what to say when you walk into a Pune cafe."},{"time":"2026-09-12T17:28:43.975Z","agent":"brand","text":"Six box designs written with exact hex codes and free Canva fonts. I say print three: Kaadepeti Classic, Pinkhead, Loadshedding."},{"time":"2026-09-12T17:28:22.089Z","agent":"supplier","text":"All three files are ready, and I have raised one decision for you: 500 boxes is below what most factories will accept, so you need to choose between a sticker-sleeve test run or saving up for 5000 custom boxes."},{"time":"2026-09-12T17:28:21.362Z","agent":"finance","text":"Big one: matchboxes count as flammable goods, so normal couriers and India Post officially refuse them - that changes the whole delivery cost picture and I am pricing local Pune hand-delivery instead."},{"time":"2026-09-12T17:27:50.988Z","agent":"finance","text":"Important: matchboxes are not taxed at 18 percent. All matches were put on one low rate in 2021 and the low slab moved lower again in the Sept 2025 GST overhaul - I am nailing the exact figure."},{"time":"2026-09-12T17:27:41.681Z","agent":"legal","text":"Good news: a reseller of ordinary safety matches does not need an explosives licence - that is the factory's problem, not yours."},{"time":"2026-09-12T17:27:33.366Z","agent":"brand","text":"Raised decision D-002 - you choose the name. My pick is Kaadepeti. Now writing 6 box designs you can build in Canva tonight."},{"time":"2026-09-12T17:27:28.161Z","agent":"launch","text":"Bad news found early: matchboxes are on courier prohibited lists in India, so normal parcel delivery outside Pune is mostly blocked. Writing the plan around that."},{"time":"2026-09-12T17:27:10.002Z","agent":"master","text":"Dashboard published as a private web link - you can open it on your phone."},{"time":"2026-09-12T17:27:09.525Z","agent":"supplier","text":"Shortlist of 10 Sivakasi makers is written, with a source link for every contact detail."},{"time":"2026-09-12T17:27:05.308Z","agent":"legal","text":"Confirmed: matches sit in trademark Class 34, and a brand owner who gets boxes packed by a factory still has label duties."},{"time":"2026-09-12T17:26:56.612Z","agent":"finance","text":"Good news for Amazon later: Amazon India now charges zero commission on items under 1,000 rupees, only a small fixed fee - I am checking the exact 2026 numbers."},{"time":"2026-09-12T17:26:05.063Z","agent":"brand","text":"Ten names done. Four of them are already taken by real brands - good news, I found that out before you printed 500 boxes."},{"time":"2026-09-12T17:25:48.203Z","agent":"supplier","text":"Have enough names and numbers - now writing the three files for you."},{"time":"2026-09-12T17:25:24.591Z","agent":"launch","text":"Checking whether matchboxes count as dangerous goods - this decides if Amazon, Flipkart and quick-commerce are even possible."},{"time":"2026-09-12T17:25:10.199Z","agent":"legal","text":"Found that selling online can force GST registration even below the 40 lakh limit - checking the exact rule now."},{"time":"2026-09-12T17:25:00.014Z","agent":"supplier","text":"Got phone numbers for several Sivakasi match factories, including one called Sri Ramesh Colour Match Works."},{"time":"2026-09-12T17:24:54.772Z","agent":"finance","text":"Starting the money model - checking the real GST rate on matchboxes before I do any maths, because it is unusually low."},{"time":"2026-09-12T17:24:34.826Z","agent":"brand","text":"Heads up: I cannot open WHOIS or Instagram directly from here, so every availability call is search-evidence only and I say so in the file - you must confirm on a registrar before printing anything."},{"time":"2026-09-12T17:24:29.781Z","agent":"launch","text":"Started work on the 500-box sell-through plan, cafe pitch and marketplace roadmap."},{"time":"2026-09-12T17:24:23.071Z","agent":"supplier","text":"Found a Sivakasi maker already selling matches with black heads - good sign for our look."},{"time":"2026-09-12T17:24:06.250Z","agent":"brand","text":"Started on brand names - 10 options coming, and I am actually checking domains before I claim anything is free."},{"time":"2026-09-12T17:24:02.370Z","agent":"website","text":"Starting on the pre-order website - first checking which free form tools work without a backend"},{"time":"2026-09-12T17:23:58.312Z","agent":"supplier","text":"Found a big warning early: most Sivakasi factories only take orders of 50,000 boxes and up, not 500."},{"time":"2026-09-12T17:23:54.853Z","agent":"legal","text":"Checking whether someone who only SELLS safety matches needs an explosives licence, or only the factory that makes them."},{"time":"2026-09-12T17:23:40.395Z","agent":"supplier","text":"Company websites are blocked on this machine, so I am gathering everything from search results and marking clearly what still needs a phone call."},{"time":"2026-09-12T17:23:05.339Z","agent":"legal","text":"Starting work on the legal checklist, packaging label rules, and trademark notes."},{"time":"2026-09-12T17:22:42.073Z","agent":"supplier","text":"Started hunting for real matchstick makers in Sivakasi."},{"time":"2026-09-12T17:22:01.689Z","agent":"master","text":"Shared state helper installed - all 6 agents can now report progress safely."},{"time":"2026-09-12T17:20:19Z","agent":"master","text":"Matchbox HQ dashboard is built and running."},{"time":"2026-09-12T17:20:19Z","agent":"master","text":"Budget loaded: 20,000 rupees total. Nothing spent yet."},{"time":"2026-09-12T17:20:19Z","agent":"master","text":"All 6 team members briefed and started."},{"time":"2026-09-12T17:20:19Z","agent":"master","text":"First decision is waiting for you: how we take money on day one."}]},"decisions":{"decisions":[{"id":"D-001","title":"How do we take money on day one?","why":"The website cannot be finished until this is settled. It changes what we build and what paperwork we need.","options":[{"label":"A. Waitlist first, no money","detail":"People just leave name + phone. Zero paperwork, live today. You learn demand before spending a rupee."},{"label":"B. UPI QR pre-order","detail":"People pay you directly on your UPI ID and send a screenshot. Free, works now, but manual and messy after ~50 orders."},{"label":"C. Razorpay checkout","detail":"Proper card/UPI checkout. Needs PAN, bank account, and ideally GST. Takes a few days to approve, 2% fee per order."}],"recommendation":"A now, C later. Collect a waitlist this week, and only switch on real payments once we have 100+ names and a supplier quote. It keeps all 20,000 rupees in your pocket until demand is proven.","status":"open","answer":null,"answeredAt":null,"blocks":["T12","T13"],"created":"2026-09-12T17:20:19Z","priority":"now"},{"id":"D-002","title":"Which brand name do we lock?","why":"Everything downstream is frozen until this is decided - the domain, the Instagram handle, the trademark filing (T6), and most of all the box artwork going to print. Renaming after 500 boxes are printed costs the whole run.","raisedBy":"brand","options":[{"label":"A. KAADEPETI","detail":"Marathi for matchbox. Most Pune, most ownable, cleanest availability signal. Nothing found using it."},{"label":"B. DECCAN MATCHWORKS","detail":"Heritage factory story, lets you number the drops (No.01, No.02) which drives collecting. Longer handle."},{"label":"C. PINKHEAD","detail":"Blunt English, literally describes the pink head on a black stick. Best recall, weakest trademark."}],"recommendation":"KAADEPETI. It is the product name in Pune's own language, it looked free in every check I could run, and PINKHEAD survives as the name of the flagship box in Drop 01. Confirm on a registrar + the Instagram app before printing.","status":"open","answer":null,"answeredAt":null,"blocks":["T6","T8"],"created":"2026-09-12T17:27:28.709Z","priority":"now"},{"id":"D-009","title":"Drop 01 shrinks to 300 boxes, and the price is 99","why":"The box now costs 13.50 to 23 landed instead of 9. 500 boxes no longer fits inside 20,000 without killing the reserve, and 79 rupees stops covering a rider delivery. Both the drop size and the price have to move together - this is one decision, not two.","raisedBy":"finance","options":[{"label":"A. 300 boxes at 99, buy 600 trays","detail":"RECOMMENDED. Costs 10,600 to launch, leaves 9,400 in the bank. Break-even 204 of 300. Drop 02's trays are already paid for, so Drop 02 breaks even at 73 boxes."},{"label":"B. 500 boxes at 99, buy 500 trays","detail":"Costs 14,750 to launch, leaves 5,250 - under the danger line before you sell anything, no reserve, and no trays left over so Drop 02 pays full price again."},{"label":"C. 300 boxes at 79","detail":"Break-even 303 boxes out of a 300-box drop. You sell out and are still short. A rider delivery keeps minus 90 paise. Do not do this."}],"recommendation":"A - 300 boxes at 99 rupees, 600 trays bought once. It is the only option that survives a high supplier quote AND leaves Drop 02 cheap.","status":"open","answer":null,"answeredAt":null,"blocks":["F1"],"created":"2026-09-12T18:23:42.403Z","priority":"now"},{"id":"D-011","title":"How many plain trays in the first bulk order?","why":"Trays are the reusable half of the model. Freight from Sivakasi costs the same whether you ship 500 or 2000, so buying small means paying 7 rupees a tray landed instead of 5.50. But every extra tray is cash locked in matches before you have sold anything. This is the single biggest cheque of the whole launch.","raisedBy":"prodops","options":[{"label":"A. 500 trays","detail":"2,500 goods + 1,000 freight = 3,500. Landed 7.00 per tray. Covers Drop 01 only. Lowest risk, worst price."},{"label":"B. 1,000 trays","detail":"4,500 goods + 1,000 freight = 5,500. Landed 5.50 per tray. Covers Drop 01 AND Drop 02. Re-buy during Drop 02."},{"label":"C. 2,000 trays","detail":"8,400 goods + 1,200 freight = 9,600. Landed 4.80 per tray. Covers four drops. Locks up nearly half your total budget in matches."}],"recommendation":"B - 1,000 trays for about 5,500. Going 500 to 1,000 cuts your landed cost 21 percent for 3,000 more cash. Going 1,000 to 2,000 cuts it only another 13 percent for 3,900 more. 1,000 is the knee in the curve and it leaves 7,500 free.","status":"open","answer":null,"answeredAt":null,"blocks":["P3"],"created":"2026-09-12T18:26:14.362Z","priority":"now"},{"id":"D-003","title":"First run: 500 boxes is below most factory minimums","why":"(Mostly answered by the newer trays decision below. Left here for the record.) Sivakasi factories private-label from about 5,000 boxes upward, and 50,000 is common. Pink and black match heads mean a special chemical batch, and black sticks mean a separate dyeing run. No factory will do that for 500 boxes. Your 8000 rupee budget is fine - the quantity is what blocks you. This decides whether you spend money now or wait.","raisedBy":"supplier","options":[{"label":"A. Plain boxes plus your own printed sleeve","detail":"Buy 500 plain Sivakasi boxes (try to get black heads, one maker already sells them) and print wrap-around sleeves in Pune. Roughly 2000 to 4000 rupees all in. No pink heads. You can test the market this month."},{"label":"B. Wait and order 5000 custom boxes","detail":"Real factory-made pink and black heads on black sticks. Estimated 8 to 18 rupees a box, so roughly 40000 to 90000 rupees. Ten times your current budget and a longer wait."},{"label":"C. Pay the small-run penalty for 500 custom boxes","detail":"Ask a few factories to break their minimum. Likely 25 to 60 rupees a box, so 12500 to 30000 rupees, and most will simply say no."}],"recommendation":"Go with A. Get 500 boxes on Pune shelves this month for under 4000 rupees and find out if people actually pay 49 to 99 for this. If they do, option B pays for itself. Pink heads are the only thing a sleeve cannot fake, so launch on black heads first.","status":"open","answer":null,"answeredAt":null,"blocks":["T4"],"created":"2026-09-12T17:28:16.809Z","priority":"later"},{"id":"D-004","title":"Do we spend 4,500 rupees on the trademark now, or later?","why":"Matches are trademark Class 34 and the fee is 4,500 per class with your Udyam registration. That is 22 percent of your entire 20,000 capital. But the free name search must happen BEFORE you print 500 boxes either way.","raisedBy":"legal","options":[{"label":"A. Free search only, file later","detail":"Run the free IP India search on your 5 names this week. Print boxes with a small TM. File TM-A only after you have sold around 500 boxes. Cost now: 0."},{"label":"B. File TM-A now","detail":"Lock the name immediately for 4,500. Safest against copycats, but it takes 12-18 months anyway and eats money you need for stock."},{"label":"C. Skip trademark entirely for now","detail":"Do not even search. Cheapest and by far the most dangerous - you could print 500 boxes with a name you are not allowed to use."}],"recommendation":"A. Do the free search this week - it is non-negotiable before printing. Hold the 4,500 until Drop 01 has actually sold. Do your free Udyam registration now, because that is what keeps the fee at 4,500 instead of 9,000.","status":"open","answer":null,"answeredAt":null,"blocks":["T6"],"created":"2026-09-12T17:32:03.472Z","priority":"later"},{"id":"D-005","title":"Whose address goes on the back of every matchbox?","why":"The law makes you print a complete postal address with PIN code as 'Marketed by'. There is no way around it if your brand is on the box. This means your address is on every box in every cafe in Pune, and it is the address the 500 rupee Legal Metrology registration is tied to. Changing it later means reprinting.","raisedBy":"legal","options":[{"label":"A. Your home address","detail":"Free and honest. But your home address is then public on 500+ boxes and on every marketplace listing."},{"label":"B. A parent's or relative's address","detail":"Same cost, keeps your own flat private. Needs their OK, and a bill or NOC for the Shops and Establishment filing."},{"label":"C. A cheap co-working or virtual office address in Pune","detail":"Most professional and most private. Costs roughly 500-1500 per month, which your 20,000 budget cannot really carry yet."}],"recommendation":"B if a relative agrees, otherwise A. Do not pay for a virtual office at this stage - it is a recurring cost on a one-time problem. Pick the address BEFORE the artwork goes to the printer, because it is printed on the box.","status":"open","answer":null,"answeredAt":null,"blocks":["T7"],"created":"2026-09-12T17:32:16.010Z","priority":"later"},{"id":"D-006","title":"The budget was missing packaging and delivery money","why":"Mailers and rider drops are the single biggest cost per box - bigger than the box itself - and there was no line for them. Right now that money is being taken out of your reserve, which is the money that protects you if something goes wrong.","raisedBy":"finance","options":[{"label":"A. Take it from the box budget","detail":"Cut the 500-box line from 8,000 to 5,000. My costing says 500 boxes land at about 9 rupees each = 4,500, so 5,000 is enough. Reserve goes back up to 7,500."},{"label":"B. Take it from the reserve","detail":"Leave the box budget at 8,000 and run on a 4,500 reserve. Works, but one bad print run or a batch of refunds and you are at the danger line."},{"label":"C. Order fewer boxes","detail":"Order 300 instead of 500. Costs about 2,700, frees 5,300, but break-even eats a much bigger share of the drop and you lose the collectible-set feeling."}],"recommendation":"A. The 8,000 box line was a guess made before anyone priced a box. My costing says 500 boxes land at about 9 rupees each. Cut it to 5,000, put 3,000 into packaging and delivery where the money actually goes, and keep a 7,500 reserve. Total stays at exactly 20,000.","status":"open","answer":null,"answeredAt":null,"blocks":["T17","T18"],"created":"2026-09-12T17:33:09.115Z","priority":"later"},{"id":"D-007","title":"Matches are dangerous goods - how do we ship outside Pune?","why":"Safety matches are UN 1944 Class 4.1 flammable solids. Shiprocket lists matchboxes as prohibited, Blue Dart bans IATA dangerous goods on all services, and India Post bans inflammable substances. Hand delivery inside Pune is fine, but every channel after Instagram - rest-of-India orders, Amazon, Flipkart, Blinkit, Zepto - is blocked until this is answered. It decides whether Drop 02 can be national.","raisedBy":"launch","options":[{"label":"A. Stay Pune-only for Drop 01 and 02","detail":"Hand delivery and cafe pickup only. Costs nothing, zero legal risk, and the 500 boxes do not need couriers. Decide again at Drop 03."},{"label":"B. Get a surface courier to accept UN 1944 in writing","detail":"Email 3 surface couriers the exact question before promising anyone delivery. Free to ask. Unknown if any will say yes. Could unlock rest-of-India."},{"label":"C. Ship the collectible box empty or striker-only outside Pune","detail":"Legal and cheap to ship. Pune buyers get the filled box by hand. Says so honestly on the site. Risks feeling like a lesser product."}],"recommendation":"A now, B in parallel because asking costs nothing. Do not promise anyone outside Pune a delivery date until a courier says yes in writing. Keep C as the Drop 02 answer if couriers all say no.","status":"open","answer":null,"answeredAt":null,"blocks":["T16"],"created":"2026-09-12T17:33:19.752Z","priority":"later"},{"id":"D-008","title":"Ads must point at a 249-rupee 3-box set, not a 99-rupee box","why":"At 99 rupees a single box leaves only about 56 rupees of contribution after product, packaging, delivery and gateway fees. No Meta campaign in India reliably delivers orders at 56 rupees, so ads on a single box lose money on every sale. A 3-box set at 249 lifts break-even cost-per-order to about 170 rupees - a 3x wider margin. This needs to exist on the site before the 3,000 is unlocked.","raisedBy":"launch","options":[{"label":"A. Create a 3-box set at 249 before any ad spend","detail":"Same delivery effort, 3x the contribution. Recommended."},{"label":"B. Run ads on the single 99 box anyway","detail":"Almost certainly loses money per order."},{"label":"C. Do not run ads at all, keep the 3,000","detail":"Valid. Cafes and hand-selling may simply be the better channel."}],"recommendation":"A. Build the 249 set now - it costs nothing to create and it is the only version where the ad maths works. If the set does not exist by the time 150 boxes are sold, choose C and keep the money.","status":"open","answer":null,"answeredAt":null,"blocks":["T14"],"created":"2026-09-12T17:33:19.807Z","priority":"later"},{"id":"D-010","title":"What should the 3-box set cost?","why":"Finance's revised file now prices it at 297 (three boxes at full price). Every WhatsApp message I wrote uses that number. A set at full price may not feel like a set - and the 3-box set is the only thing that makes a delivery affordable, because one rider drop carries three boxes instead of one.","raisedBy":"launch","options":[{"label":"A. 297","detail":"Three at full price. Finance's current number. Keeps every rupee of margin. Risk: nobody feels they got a deal, so nobody upgrades."},{"label":"B. 279","detail":"18 off. Reads as a real set, stays under the 300 line that matters on Amazon later. Costs you 18 a set."},{"label":"C. 249","detail":"48 off. Strongest gift offer for Diwali. Costs you 48 a set but a delivered set still keeps about 135."}],"recommendation":"B. 279 - it is visibly a set, it is still under 300, and 18 is a cheap price to pay for turning one-box orders into three-box orders.","status":"open","answer":null,"answeredAt":null,"blocks":[],"created":"2026-09-12T18:26:13.730Z","priority":"later"}]},"budget":{"total":20000,"currency":"INR","lines":[{"item":"First 500 boxes (product + printing)","agent":"supplier","planned":7500,"committed":0,"note":"RESIZED for the two-part box. 600 plain trays + freight = 4,200 (ONE-OFF, covers Drop 01 and Drop 02). 300 printed outers at 11 = 3,300 (PER DROP). Drop 01 is now 300 boxes, not 500 - at 18 rupees landed, 500 boxes does not fit inside 20,000."},{"item":"GST / Udyam / legal basics","agent":"legal","planned":1000,"committed":0,"note":"Cut from 3000. Week 1 is free. Only real cost now is the 500 rupee Legal Metrology packer registration. Trademark 4500 is a separate decision (D-004)."},{"item":"Pune-only ads (after launch)","agent":"launch","planned":3000,"committed":0,"note":"Do not spend until pre-orders prove demand."},{"item":"Website + domain","agent":"website","planned":500,"committed":0,"note":"Target: free hosting, only pay for domain."},{"item":"Reserve (do not touch)","agent":"finance","planned":5400,"committed":0,"note":"Raised from 4,500. The box costs twice what it did, so the cushion matters more. Danger line is now 8,000, not 11,000."},{"item":"Packaging, mailers + delivery money","agent":"finance","planned":2600,"committed":0,"note":"1,600 for mailers, sleeves and tape bought upfront for 300 boxes. 1,000 float for Borzo rider drops (Pune from 40-45)."}]},"deliverables":{"files":[{"name":"Matchbox HQ dashboard","path":"matchbox-hq/public/index.html","agent":"master","desc":"This screen.","updated":"2026-09-12T17:20:19Z"},{"name":"Matchbox HQ (live link)","path":"https://claude.ai/code/artifact/688f02e3-da15-4ee9-b395-29ccf4750848","agent":"master","desc":"The dashboard, openable on any phone or laptop.","updated":"2026-09-12T17:27:10.037Z"},{"name":"Brand Names (10 + availability)","path":"deliverables/brand-names.md","agent":"brand","desc":"10 name options, real availability checks, top 3 shortlist - your call","updated":"2026-09-12T17:27:28.669Z"},{"name":"Supplier Shortlist","path":"deliverables/supplier-shortlist.md","agent":"supplier","desc":"10 Sivakasi match makers with sourced contacts, plus a reality check on the 500-box budget","updated":"2026-09-12T17:28:05.783Z"},{"name":"Supplier Outreach Messages","path":"deliverables/supplier-outreach.md","agent":"supplier","desc":"Copy-paste WhatsApp, email and follow-up enquiries with all the right questions","updated":"2026-09-12T17:28:05.819Z"},{"name":"Quote Tracker","path":"deliverables/supplier-quote-tracker.md","agent":"supplier","desc":"Blank comparison table to fill in as quotes come back","updated":"2026-09-12T17:28:05.857Z"},{"name":"Box Concepts (6 briefs)","path":"deliverables/box-concepts.md","agent":"brand","desc":"6 Canva-ready box designs with hex codes, plus which 3 to print first","updated":"2026-09-12T17:28:43.940Z"},{"name":"30-Day Instagram Calendar","path":"deliverables/instagram-30-days.md","agent":"brand","desc":"One post a day for 30 days with captions and hashtags written out, phone-only","updated":"2026-09-12T17:30:23.933Z"},{"name":"Legal checklist (do this / not yet / ignore)","path":"deliverables/legal-checklist.md","agent":"legal","desc":"Week 1 is free. GST is not needed until you ship outside Maharashtra or list on Amazon.","updated":"2026-09-12T17:31:51.925Z"},{"name":"Matchbox label rules + ready-to-use template","path":"deliverables/packaging-label-rules.md","agent":"legal","desc":"Exactly what the law makes you print on the box, with a template for your designer.","updated":"2026-09-12T17:31:51.960Z"},{"name":"Trademark notes (Class 34)","path":"deliverables/trademark-notes.md","agent":"legal","desc":"Matches are Class 34. Free search now, 4500 rupee filing later.","updated":"2026-09-12T17:31:51.997Z"},{"name":"Pune Seeding Plan","path":"deliverables/seeding-plan.md","agent":"brand","desc":"How to place 60 free boxes with the right 30 people in Pune, with word-for-word scripts","updated":"2026-09-12T17:31:56.421Z"},{"name":"Drop 01 plan - 500 boxes","path":"deliverables/drop-01-plan.md","agent":"launch","desc":"Week-by-week plan to sell 500 boxes, plus the flop plan and the sell-out plan","updated":"2026-09-12T17 n-Pune reply, confirmations, delays, refunds","updated":"2026-09-12T18:26:05.634Z"},{"name":"Press & Creators","path":"deliverables/press-and-creators.md","agent":"launch","desc":"Which kinds of Pune outlets and creators to approach, plus the 90-word email and 40-word DM","updated":"2026-09-12T18:26:05.671Z"},{"name":"Drop Calendar","path":"deliverables/drop-calendar.md","agent":"launch","desc":"Drops 01, 02 and 03 - dates, sizes, windows and what must be true before each","updated":"2026-09-12T18:26:05.715Z"},{"name":"Vendor sheet (updated in place)","path":"vendors/Matchbox_Vendors_Pune.xlsx","agent":"prodops","desc":"Your own file - EXAMPLE row deleted, real contacts filled in, 8 vendors ranked 1-8, 7 Pune printers added, new Stock tab","updated":"2026-09-12T18:26:27.123Z"},{"name":"Production model - trays + printed outers","path":"deliverables/production-model.md","agent":"prodops","desc":"Recommended first purchase 12,500 rupees. Per box 16.50 on Drop 01, 11 on Drop 02.","updated":"2026-09-12T18:26:27.173Z"},{"name":"Sample plan","path":"deliverables/sample-plan.md","agent":"prodops","desc":"50 boxes from 3 vendors for about 1,500 rupees, plus a 30-point scoring sheet","updated":"2026-09-12T18:26:27.313Z"},{"name":"Ops calendar - first call to 500 boxes","path":"deliverables/ops-calendar.md","agent":"prodops","desc":"6 weeks. First call 14 Sep, boxes in hand 24 Oct, with the dates a delay kills you","updated":"2026-09-12T18:26:27.359Z"},{"name":"Pre-order + waitlist website","path":"website/index.html","agent":"website","desc":"One-file site: permanent WhatsApp waitlist plus a per-drop pre-order with an honest X-of-500 counter and four drop states.","updated":"2026-09-12T18:29:51.616Z"},{"name":"Drop state file","path":"website/state.json","agent":"website","desc":"The same drop numbers (name, total, claimed, dates, price) in a small file the office dashboard can read.","updated":"2026-09-12T18:29:51.654Z"},{"name":"Website guide (founder)","path":"deliverables/website-guide.md","agent":"website","desc":"Plain-English steps: open a drop, close it, update the claimed count, reuse the site for Drop 02.","updated":"2026-09-12T18:29:51.690Z"}]},"requests":{"requests":[]}};
const A = {}; (STATE.agents?.agents || []).forEach(a => A[a.id] = a);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rupee = n => '₹' + Number(n || 0).toLocaleString('en-IN');
function ago(iso){ if(!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso))/1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s/60) + ' min ago';
  if (s < 172800) return Math.round(s/3600) + ' hr ago';
  return Math.round(s/86400) + ' days ago'; }
const who = id => A[id] || {name:id, color:'#8A8078'};

document.getElementById('stamp').textContent = 'Snapshot ' + new Date(STATE.now).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
document.getElementById('fstamp').textContent = new Date(STATE.now).toLocaleDateString('en-IN',{dateStyle:'medium'});

/* board */
document.getElementById('board').innerHTML = [['todo','To do'],['inprogress','In progress'],['review','Ready for you'],['done','Done']]
  .map(([k,label]) => { const list = (STATE.tasks?.tasks||[]).filter(t => t.status === k);
    return '<div class="col"><div class="colh"><span>'+label+'</span><b>'+list.length+'</b></div>' +
      (list.length ? list.map(t => { const a = who(t.agent);
        return '<div class="task"><div class="t">'+esc(t.title)+'</div>' +
          (t.note ? '<div class="n">'+esc(t.note)+'</div>' : '') +
          '<div class="tag" style="color:'+esc(a.color)+'"><i class="pip" style="background:'+esc(a.color)+'"></i>'+esc(a.name)+'</div></div>';
      }).join('') : '<div class="none">nothing here</div>') + '</div>'; }).join('');

/* agents */
document.getElementById('agents').innerHTML = (STATE.agents?.agents||[]).map(a =>
  '<div class="ag"><i class="pip" style="background:'+esc(a.color)+'"></i><div><div class="nm">'+esc(a.name)+'</div>' +
  '<div class="dg">'+esc(a.doing||'Waiting for instructions')+'</div>' +
  '<div class="mt"><span class="'+(a.status==='working'?'live':'')+'">'+esc(a.status)+'</span> · '+ago(a.lastUpdate)+'</div></div></div>').join('');

/* feed */
const evs = STATE.activity?.events || [];
document.getElementById('feed').innerHTML = evs.length ? evs.slice(0,50).map(e => { const a = who(e.agent);
  return '<div class="ev">'+esc(e.text)+'<div class="mt"><span style="color:'+esc(a.color)+'">'+esc(a.name)+'</span> · '+ago(e.time)+'</div></div>';
}).join('') : '<div class="none">Nothing yet.</div>';

/* money */
const B = STATE.budget || {total:20000, lines:[]};
const spent = B.lines.reduce((s,l)=>s+(+l.committed||0),0);
const planned = B.lines.reduce((s,l)=>s+(+l.planned||0),0);
const free = B.total - planned;
document.getElementById('money').innerHTML =
  '<div class="stat"><div class="l">You have</div><div class="v">'+rupee(B.total)+'</div></div>' +
  '<div class="stat"><div class="l">Actually spent</div><div class="v" style="color:var(--ember)">'+rupee(spent)+'</div></div>' +
  '<div class="stat"><div class="l">Set aside</div><div class="v" style="color:var(--dim)">'+rupee(planned)+'</div></div>' +
  '<div class="stat"><div class="l">Still in pocket</div><div class="v" style="color:var(--green)">'+rupee(B.total-spent)+'</div></div>';
document.getElementById('bar').innerHTML =
  '<i style="width:'+(spent/B.total*100)+'%;background:var(--ember)"></i>' +
  '<i style="width:'+(Math.max(0,planned-spent)/B.total*100)+'%;background:var(--panel2)"></i>' +
  '<i style="width:'+(Math.max(0,free)/B.total*100)+'%;background:var(--green)"></i>';
document.getElementById('blines').innerHTML = B.lines.map(l => { const a = who(l.agent);
  return '<div class="brow"><div><i class="pip" style="background:'+esc(a.color)+'"></i> '+esc(l.item) +
    '<div class="n">'+esc(l.note||'')+'</div></div>' +
    '<div class="amt">'+rupee(l.planned)+'<small>spent '+rupee(l.committed)+'</small></div></div>'; }).join('');

/* files */
const F = STATE.deliverables?.files || [];
document.getElementById('files').innerHTML = F.length ? F.map(f => { const a = who(f.agent);
  return '<div class="file"><b>'+esc(f.name)+'</b> — '+esc(f.desc||'') +
    '<div class="p" style="color:'+esc(a.color)+'">'+esc(a.name)+' · '+esc(f.path)+'</div></div>'; }).join('')
  : '<div class="none">Nothing finished yet — the team started minutes ago.</div>';

/* decisions + live input via db */
let DB = null;
const answers = {};
function card(d, compact){
  const ans = answers[d.id] || d.answer;
  if (ans) return '<div class="dec done-dec"><h3>&#10003; '+esc(d.title)+'</h3><div class="why">You chose <b style="color:var(--green)">'+esc(ans)+'</b> — Claude picks this up next cycle.</div></div>';
  return '<div class="dec"><span class="chip '+(d.priority==='later'?'later':'now')+'">'+(d.priority==='later'?'can wait':'answer now')+'</span>' +
    '<h3>'+esc(d.title)+'</h3><div class="why">'+esc(d.why)+'</div>' +
    (d.options||[]).map(o => '<div class="opt"><b>'+esc(o.label)+'</b><span>'+esc(o.detail)+'</span></div>').join('') +
    '<div class="rec"><b>Claude recommends</b>'+esc(d.recommendation)+'</div>' +
    '<div class="picks">' + (d.options||[]).map(o =>
      '<button class="pick" data-id="'+esc(d.id)+'" data-ans="'+esc(o.label)+'">Choose '+esc(o.label.split('.')[0].trim())+'</button>').join('') +
    '</div></div>';
}
function renderDecisions(){
  const list = STATE.decisions?.decisions || [];
  const el = document.getElementById('decisions');
  if(!list.length){ el.innerHTML = '<div class="panel none">Nothing needs your decision right now.</div>'; return; }
  const isOpen = d => !(answers[d.id] || d.answer);
  const now = list.filter(d => d.priority !== 'later' || !isOpen(d));
  const later = list.filter(d => d.priority === 'later' && isOpen(d));
  el.innerHTML = now.map(d => card(d)).join('') +
    (later.length ? '<details class="later"><summary>'+later.length+' more that can wait — open when you have a calm 10 minutes</summary>' +
      later.map(d => card(d)).join('') + '</details>' : '');
  el.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => choose(b));
}
async function choose(b){
  const id = b.dataset.id, ans = b.dataset.ans;
  b.textContent = 'Saving…'; b.disabled = true;
  if(!DB){ answers[id] = ans + ' (tell Claude in chat — saving is off here)'; renderDecisions(); return; }
  try{
    await DB.doc('decisions/' + id).set({ decision: id, answer: ans, at: new Date().toISOString(), status: 'answered' });
    answers[id] = ans;
  }catch(e){ answers[id] = ans + ' (not saved — tell Claude in chat)'; }
  renderDecisions();
}
renderDecisions();

const note = document.getElementById('note'), sentBox = document.getElementById('sent');
function renderSent(rows){
  if(!rows.length){ sentBox.hidden = true; return; }
  sentBox.hidden = false;
  sentBox.innerHTML = '<div class="l" style="font-family:var(--f-num);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px">Your instructions · '+rows.length+'</div>' +
    rows.slice(0,6).map(r => '<div class="ev">'+esc(r.text)+'<div class="mt">'+ago(r.at)+' · '+esc(r.status||'new')+'</div></div>').join('');
}
document.getElementById('send').onclick = async () => {
  const ta = document.getElementById('req'); const text = ta.value.trim();
  if(!text) { note.textContent = 'Type something first.'; note.className = 'note'; return; }
  if(!DB){ note.textContent = 'Saving is off in this view — paste it to Claude in chat instead.'; note.className = 'note'; return; }
  const id = 'i' + Date.now();
  try{
    await DB.doc('instructions/' + id).set({ id, text, at: new Date().toISOString(), status: 'new' });
    ta.value = ''; note.textContent = 'Saved. Claude reads this at the start of the next cycle.'; note.className = 'note ok';
  }catch(e){ note.textContent = 'Could not save. Paste it to Claude in chat instead.'; note.className = 'note'; }
};
(async () => {
  DB = await window.claude?.use?.('db');
  if(!DB) return;
  DB.collection('instructions').orderBy('at','desc').onSnapshot(snap => {
    renderSent(snap.docs ? snap.docs.map(d => d.data ? d.data() : d) : []);
  }, () => {});
  DB.collection('decisions').onSnapshot(snap => {
    const rows = snap.docs ? snap.docs.map(d => d.data ? d.data() : d) : [];
    rows.forEach(r => { if(r && r.decision && r.answer) answers[r.decision] = r.answer; });
    renderDecisions();
  }, () => {});
})();
</script>
